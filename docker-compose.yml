services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: coach, POSTGRES_PASSWORD: coach, POSTGRES_DB: coach }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://coach:coach@db:5432/coach
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["8000:8000"]
    depends_on: [db]
volumes: { pgdata: {} }
