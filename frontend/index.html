<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interview Coach</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;700&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2433;--paper:#f6f7f9;--line:#d5d9e0;--accent:#2f5fd0;--good:#1f7a4d;--bad:#b3402a}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:32px 20px 80px}
h1,h2{font-family:Newsreader,Georgia,serif;line-height:1.2}h1{font-size:2.2rem;margin:0 0 4px}
.box{background:#fff;border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin:16px 0}
input,textarea,button{font:inherit}input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:4px;margin:6px 0}
textarea{min-height:160px}button{background:var(--accent);color:#fff;border:0;padding:10px 18px;border-radius:4px;cursor:pointer}
button:disabled{opacity:.5}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #9db8f5}
.link{background:none;color:var(--accent);padding:0}.err{color:var(--bad)}.score{font-family:Newsreader,serif;font-size:2.4rem;font-weight:700}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
</style></head>
<body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
